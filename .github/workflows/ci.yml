name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify production-only package startup
        shell: bash
        run: |
          package_dir=$(mktemp -d)
          install_dir=$(mktemp -d)
          npm pack --pack-destination "$package_dir"
          npm install --prefix "$install_dir" --omit=dev --no-audit --no-fund "$package_dir"/*.tgz
          npm run smoke:stdio -- "$install_dir/node_modules/lenovo-dcsc-mcp/dist/mcp/server.js"
