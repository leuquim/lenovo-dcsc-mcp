[mcp_servers.lenovo-dcsc]
command = "/absolute/path/to/node"
args = ["/absolute/path/to/lenovo-dcsc-mcp/dist/mcp/server.js"]
startup_timeout_sec = 30
tool_timeout_sec = 900

[mcp_servers.lenovo-dcsc.env]
DCSC_SESSION_FILE = "/absolute/path/to/state/codex-sessions.json"
DCSC_ARTIFACT_DIR = "/absolute/path/to/state/codex-artifacts"
